title: VSLink
description: "Homepage and documentation for VSLink."

remote_theme: just-the-docs/just-the-docs

markdown: kramdown
kramdown:
  input: GFM

color_scheme: system #(light/dark/system)
search_enabled: true

logo: "/assets/logo.png"
favicon_ico: "/assets/favicon.ico"

url: "https://jackjburnett.github.io"
baseurl: "/VSLink"

repository_url: https://github.com/jackjburnett/VSLink

defaults:
  - scope:
      path: ""
    values:
      layout: default
      has_toc: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

plugins:
  - jekyll-remote-theme
